# ---------------------------------------------------------------------
# SSD simulator configuration
# 语法：key = value，# 开头为注释；命令行 --key=value 可覆盖此处的值
# ---------------------------------------------------------------------

# ---------- 介质几何 ----------
channels   = 2      # 通道数
ce         = 2      # 每通道 CE 数
dies       = 1      # 每 CE 的 die 数
planes     = 2      # 每 die 的 plane 数（通常 2 的幂）
blocks     = 128    # 每 plane 的 block 数
pages      = 256    # 每 block 的 page 数
page_size  = 16384  # data 区字节数（16KB）
spare_size = 2048   # spare 区字节数（存放 P2L / 时间戳等元数据）

# ---------- 时序（ns）----------
# TLC 典型量级：program 2ms / read 60us / erase 5ms
t_prog = 2000000
t_read = 60000
t_bers = 5000000
t_xfer = 20000     # 通道传输一个 data page 的时间

# ---------- 可靠性 ----------
pe_limit   = 3000  # 标称 P/E 次数
ecc        = 60    # ECC 纠错能力（bit / 1KB）
factory_bb = 5     # 出厂坏块比例，千分比（5 = 0.5%）

# ---------- FTL ----------
op = 7             # 过度供给百分比

# ---------- 运行 ----------
seed      = 1
log_level = info

